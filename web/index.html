<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delhi bus journey planner</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f7f5;color:#172b24;max-width:850px;margin:auto;padding:24px}h1{margin-bottom:.2em}label{display:block;font-weight:600;margin-top:14px}input,select,button{box-sizing:border-box;width:100%;padding:10px;font:inherit;border:1px solid #aabbb1;border-radius:6px;background:white}button{background:#176844;color:white;border:0;margin-top:18px;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #d6e2da;border-radius:8px;padding:16px;margin:14px 0}.muted{color:#4b6156;font-size:.9em}.error{color:#a12b20}ul{padding-left:20px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head>
<body><h1>Delhi bus journey planner</h1><p>Compare scheduled bus journeys and the ticket-based demand signal.</p>
<div class="card"><div class="row"><div><label for="fromSearch">Search boarding stop</label><input id="fromSearch" placeholder="Type a stop name"><label for="from">Boarding stop</label><select id="from"><option value="">Search to find stops</option></select></div><div><label for="toSearch">Search destination stop</label><input id="toSearch" placeholder="Type a stop name"><label for="to">Destination stop</label><select id="to"><option value="">Search to find stops</option></select></div></div><label for="departure">Departure in Delhi time</label><input id="departure" type="datetime-local"><button id="find">Find journeys</button><p id="status" role="status"></p></div>
<p class="muted">Signals reflect matched tickets per scheduled bus crossing, not actual occupancy or seat availability. Schedules and ticket coverage may differ from reality. Walking is not included.</p><section id="results" aria-live="polite"></section>
<script>
const $=id=>document.getElementById(id); let timers={};
for(const side of ['from','to']) $(side+'Search').addEventListener('input',()=>{clearTimeout(timers[side]);const q=$(side+'Search').value.trim();if(q.length<2){$(side).replaceChildren(new Option('Enter at least two letters',''));return}timers[side]=setTimeout(async()=>{try{const r=await fetch('/stops?q='+encodeURIComponent(q));const data=await r.json();if(!r.ok)throw Error(data.error);$(side).replaceChildren(new Option('Choose a stop',''),...data.stops.map(s=>new Option(s.stop_name+' ('+s.stop_id+')',s.stop_id)))}catch(e){$('status').textContent='Stop search failed: '+e.message}},300)});
const now=new Date(Date.now()+330*60000);$('departure').value=now.toISOString().slice(0,16);
function element(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
$('find').addEventListener('click',async()=>{const origin=$('from').value,destination=$('to').value,time=$('departure').value;$('results').replaceChildren();if(!origin||!destination||!time){$('status').textContent='Choose both stops and a departure time.';return}$('status').textContent='Searching scheduled buses…';const params=new URLSearchParams({from_stop_id:origin,to_stop_id:destination,departure:time+':00+05:30'});try{const response=await fetch('/journeys?'+params),data=await response.json();if(!response.ok)throw Error(data.error);$('status').textContent=data.journeys.length?data.journeys.length+' direct scheduled options found.':'No direct scheduled bus found within two hours.';for(const j of data.journeys){const card=element('article','', 'card');card.append(element('h2','Route '+j.route),element('p','Departure '+j.scheduled_departure.slice(11,16)+' · Arrival '+j.scheduled_arrival.slice(11,16)+' · Wait '+Math.round(j.waiting_minutes)+' min · Ride '+Math.round(j.ride_minutes)+' min'));const observed=j.segments.filter(s=>s.signal_status==='available'&&s.all_scheduled_days_signal);card.append(element('p','Ticket signal available for '+observed.length+' of '+j.segments.length+' segments.'));if(observed.length){const list=element('ul','');for(const seg of observed){const proxy=seg.all_scheduled_days_signal;list.append(element('li',seg.from_stop_id+' → '+seg.to_stop_id+': '+proxy.sample_passengers_per_scheduled_crossing.toFixed(2)+' sampled passengers per scheduled crossing'))}card.append(list)}card.append(element('p','This is an observed ticket-sample signal, not an estimate of everyone on the bus.','muted'));$('results').append(card)}}catch(e){$('status').textContent='Journey search failed: '+e.message}});
</script></body></html>
